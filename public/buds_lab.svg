<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <!-- White Background for crisp rendering -->
  <rect width="100%" height="100%" fill="white" rx="8" />

  <!-- Orange connecting network lines -->
  <polyline 
    points="58,68 152,36 218,68" 
    fill="none" 
    stroke="#F37021" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- "buds lab" main typography -->
  <g fill="#050505" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" letter-spacing="-1.5">
    <!-- b -->
    <text x="14" y="98">b</text>
    <!-- u -->
    <text x="96" y="98">u</text>
    <!-- d -->
    <text x="174" y="98">d</text>
    <!-- s -->
    <text x="248" y="98">s</text>
    <!-- lab -->
    <text x="338" y="98">lab</text>
  </g>

  <!-- Network Nodes (Blue rings with white centers) -->
  <!-- Node in 'b' bowl -->
  <circle cx="58" cy="68" r="16" fill="#004B87" />
  <circle cx="58" cy="68" r="8" fill="#FFFFFF" />

  <!-- Top Node above 'u' -->
  <circle cx="152" cy="36" r="14" fill="#004B87" />
  <circle cx="152" cy="36" r="7" fill="#FFFFFF" />

  <!-- Node in 'd' bowl -->
  <circle cx="218" cy="68" r="16" fill="#004B87" />
  <circle cx="218" cy="68" r="8" fill="#FFFFFF" />

  <!-- Subtitle: building and urban data science -->
  <text 
    x="14" 
    y="136" 
    fill="#050505" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="500" 
    font-size="25.5" 
    letter-spacing="-0.5"
  >
    building and urban data science
  </text>
</svg>
